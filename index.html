<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pankaj Bharadwaj</title>
  <meta name="description" content="Learn, Trade, Grow — educational market concepts, chart reading and case discussions.">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
      overflow: hidden;
    }
    .wrap {
      position: relative;
      width: min(100vw, 1024px);
      line-height: 0;
    }
    .reference {
      display: block;
      width: 100%;
      height: auto;
    }
    .telegram {
      position: absolute;
      left: 14.8%;
      width: 70.5%;
      top: 69.0%;
      height: 7.5%;
      border-radius: 999px;
      display: block;
      cursor: pointer;
      text-decoration: none;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .telegram:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }
    @media (max-width: 600px) {
      .wrap { width: 100vw; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="wrap">
      <img class="reference" src="reference.png" alt="Pankaj Bharadwaj educational landing page">
      <!-- Replace the URL below with your real Telegram channel link. -->
      <a
        class="telegram"
        href="https://t.me/YOUR_TELEGRAM_USERNAME"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join Telegram"
      ></a>
    </div>
  </main>
</body>
</html>
